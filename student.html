          this.send(MSG.SYNC_REQUEST, gameId, {
            playerId: this.identity.playerId
          });

          if (this.joinTimeoutHandle) clearTimeout(this.joinTimeoutHandle);
          this.joinTimeoutHandle = setTimeout(() => {
            const stale = nowTs() - this.lastInstructorSeenAt > 4500;
            if (stale && this.game.phase === PHASES.LOBBY) {
              this.render("No active game responded to that code.");
            }
          }, 5200);

          this.render("Trying to join game " + gameId + "...");
        }

        onMessage(msg) {
          if (msg.senderRole !== "instructor") return;
          if (!this.identity.gameId) return;
          if (this.identity.gameId && msg.gameId !== this.identity.gameId) return;

          this.lastInstructorSeenAt = nowTs();

          switch (msg.type) {
            case MSG.PLAYER_JOINED:
              this.handleJoined(msg.payload);
              break;
            case MSG.STATE_SNAPSHOT:
              this.handleSnapshot(msg.payload);
              break;
            case MSG.QUESTION_STARTED:
              this.handleQuestionStarted(msg.payload);
              break;
            case MSG.ANSWER_SUBMITTED:
              this.handleSubmissionAck(msg.payload);
              break;
            case MSG.QUESTION_ENDED:
              this.handleQuestionEnded(msg.payload);
              break;
            case MSG.ANSWER_REVEALED:
              this.handleAnswerRevealed(msg.payload);
              break;
            case MSG.LEADERBOARD:
              this.handleLeaderboard(msg.payload);
              break;
            case MSG.SCORE_UPDATED:
              this.handleScoreUpdated(msg.payload);
              break;
            case MSG.SCORE_RESET:
              this.handleScoreReset(msg.payload);
              break;
            case MSG.GAME_FINISHED:
              this.handleGameFinished(msg.payload);
              break;
            case MSG.PLAYER_REMOVED:
              this.handlePlayerRemoved(msg.payload);
              break;
            case MSG.INSTRUCTOR_PRESENT:
              break;
            case MSG.DOUBLE_DOWN_SET:
              this.handleDoubleDownSet(msg.payload);
              break;
            case MSG.DOUBLE_DOWN_BUY_RESULT:
              this.handleDoubleDownBuyResult(msg.payload);
              break;
            case MSG.POINT_SHIELD_BUY_RESULT:
              this.handlePointShieldBuyResult(msg.payload);
              break;
            case MSG.STREAK_PRIZE_RESULT:
              this.handleStreakPrizeResult(msg.payload);
              break;
            default:
              break;
          }
          this.persist();
          this.render();
        }

        handleJoined(payload) {
          if (!payload) return;
          if (payload.playerId !== this.identity.playerId) return;
          this.game.playerScore = Number(payload.score || this.game.playerScore || 0);
        }

        handleSnapshot(snapshot) {
          if (!snapshot || snapshot.type !== MSG.STATE_SNAPSHOT) return;
          if (snapshot.player && snapshot.player.id && snapshot.player.id !== this.identity.playerId) return;

          this.game.gameId = snapshot.gameId || this.game.gameId;
          this.identity.gameId = this.game.gameId;
          this.game.phase = snapshot.phase || this.game.phase;
          this.game.quizTitle = snapshot.quizTitle || this.game.quizTitle;
          this.game.leaderboard = Array.isArray(snapshot.leaderboard) ? snapshot.leaderboard : this.game.leaderboard;

          if (snapshot.player) {
            this.game.playerScore = Number(snapshot.player.score || 0);
            this.game.rank = snapshot.player.rank || null;
            this.game.hasSubmitted = !!snapshot.player.hasSubmitted;
            this.game.playerRemoved = !!snapshot.player.removed;
            this.game.doubleDownArmed = !!snapshot.player.doubleDownArmed;
            this.game.doubleDownUses = Number(snapshot.player.doubleDownUses || this.game.doubleDownUses || 0);
            this.game.doubleDownCap = Number(snapshot.player.doubleDownCap || this.game.doubleDownCap || 3);
            this.game.doubleDownPurchasedCredits = Number(snapshot.player.doubleDownPurchasedCredits || this.game.doubleDownPurchasedCredits || 0);
            this.game.canBuyDoubleDown = !!snapshot.player.canBuyDoubleDown;
            this.game.doubleDownBuyCost = Number(snapshot.player.doubleDownBuyCost || this.game.doubleDownBuyCost || 3000);
            this.game.doubleDownBuyBlockedReason = String(snapshot.player.doubleDownBuyBlockedReason || this.game.doubleDownBuyBlockedReason || "");
            this.game.pointShieldNext = !!snapshot.player.pointShieldNext;
            this.game.pointShieldMode = String(snapshot.player.pointShieldMode || this.game.pointShieldMode || "NORMAL");
            this.game.pointShieldArmedForQuestionIndex = snapshot.player.pointShieldArmedForQuestionIndex == null ? null : Number(snapshot.player.pointShieldArmedForQuestionIndex);
            this.game.incomingStrikeCount = Number(snapshot.player.incomingStrikeCount || 0);
            this.game.attackedCount = Number(snapshot.player.attackedCount || this.game.attackedCount || 0);
            this.game.strikeOutcome = String(snapshot.player.strikeOutcome || "");
            this.game.strikeDelta = Number(snapshot.player.strikeDelta || 0);
            this.game.strikeCount = Number(snapshot.player.strikeCount || 0);
            this.game.canBuyPointShield = !!snapshot.player.canBuyPointShield;
            this.game.pointShieldCost = Number(snapshot.player.pointShieldCost || this.game.pointShieldCost || 2500);
            this.game.canBuyReflectiveShield = !!snapshot.player.canBuyReflectiveShield;
            this.game.reflectiveShieldCost = Number(snapshot.player.reflectiveShieldCost || this.game.reflectiveShieldCost || 4000);
            this.game.pointShieldNotice = "";
            this.game.strikeNotice = String(snapshot.player.strikeNotice || this.buildStrikeNotice(this.game.strikeOutcome, this.game.strikeDelta, this.game.strikeCount));
            this.game.playerDisplayedScore = Number(snapshot.player.displayedScore != null ? snapshot.player.displayedScore : this.game.playerDisplayedScore || this.game.playerScore || 0);
            this.game.isScoreMasked = !!snapshot.player.isScoreMasked;
            this.game.fakeScoreTurnsRemaining = Number(snapshot.player.fakeScoreTurnsRemaining || 0);
            this.game.fakeScorePrimed = !!snapshot.player.fakeScorePrimed;
            this.game.correctStreak = Number(snapshot.player.correctStreak || this.game.correctStreak || 0);
            this.game.longestStreak = Number(snapshot.player.longestStreak || this.game.longestStreak || 0);
            this.game.streakPrizeAvailable = !!snapshot.player.streakPrizeAvailable;
            this.game.streakPrizeUsed = !!snapshot.player.streakPrizeUsed;
            this.game.streakPrizeUses = Number(snapshot.player.streakPrizeUses || this.game.streakPrizeUses || 0);
            this.game.streakPrizeNextIndex = Number(snapshot.player.streakPrizeNextIndex || this.game.streakPrizeNextIndex || 0);
            this.game.streakPrizeAction = String(snapshot.player.streakPrizeAction || this.game.streakPrizeAction || "");
            this.game.prizeTargets = Array.isArray(snapshot.player.prizeTargets) ? snapshot.player.prizeTargets : [];
            this.game.totalPlayers = Number(snapshot.player.totalPlayers || this.game.totalPlayers || 0);
            this.game.doubleDownDisabledReason = typeof snapshot.player.doubleDownDisabledReason === "string" ? snapshot.player.doubleDownDisabledReason : (this.game.doubleDownDisabledReason || "");
          }

          if (snapshot.question) {
            this.game.question = snapshot.question;
          }

          if (snapshot.reveal) {
            this.game.reveal = snapshot.reveal;
          }

          if (this.game.phase !== PHASES.QUESTION) {
            this.game.selectedIds = [];
          }

          this.refreshDoubleDownPolicy(this.game.doubleDownDisabledReason);
        }

        handleQuestionStarted(payload) {
          if (!payload) return;
          this.game.phase = PHASES.QUESTION;
          this.game.question = payload;
          this.game.reveal = null;
          this.game.hasSubmitted = false;
          this.game.selectedIds = [];
          this.game.playerScoreBeforeReveal = this.game.playerScore;
          this.game.doubleDownArmed = false;
          this.game.doubleDownNotice = "";
          this.game.streakPrizeNotice = "";
          this.game.pointShieldNotice = "";
          this.game.incomingStrikeCount = 0;
          this.game.attackedCount = 0;
          this.game.strikeOutcome = "";
          this.game.strikeDelta = 0;
          this.game.strikeCount = 0;
          this.game.strikeNotice = "";

          if (this.game.pointShieldNext) {
            this.game.pointShieldArmedForQuestionIndex = Number(payload.questionIndex);
            this.game.pointShieldNext = false;
          }

          if (this.game.pointShieldArmedForQuestionIndex != null && Number(this.game.pointShieldArmedForQuestionIndex) < Number(payload.questionIndex)) {
            this.game.pointShieldArmedForQuestionIndex = null;
          }

          this.game.canBuyPointShield = false;
          this.game.canBuyReflectiveShield = false;

          if (Number(this.game.fakeScoreTurnsRemaining || 0) > 0) {
            if (this.game.fakeScorePrimed) {
              this.game.fakeScorePrimed = false;
            } else {
              this.game.fakeScoreTurnsRemaining = Math.max(0, Number(this.game.fakeScoreTurnsRemaining || 0) - 1);
            }
          }

          this.game.isScoreMasked = Number(this.game.fakeScoreTurnsRemaining || 0) > 0;
          this.game.playerDisplayedScore = this.game.isScoreMasked
            ? Math.trunc(Number(this.game.playerScore || 0) / 2)
            : Number(this.game.playerScore || 0);

          this.refreshDoubleDownPolicy();
        }

        handleSubmissionAck(payload) {
          if (!payload || payload.playerId !== this.identity.playerId) return;
          if (payload.accepted) {
            this.game.hasSubmitted = true;
            this.ui.updateLockedBanner();
          }
        }

        handleQuestionEnded() {
          if (this.game.phase === PHASES.QUESTION) {
            this.game.phase = PHASES.ANSWER_REVEAL;
          }
        }

        handleAnswerRevealed(payload) {
          this.game.phase = PHASES.ANSWER_REVEAL;
          this.game.reveal = payload ? payload.reveal : null;
          this.game.playerScoreBeforeReveal = this.game.playerScore;
          if (this.game.reveal && this.game.reveal.playerOutcomes && this.game.reveal.playerOutcomes[this.identity.playerId]) {
            const mine = this.game.reveal.playerOutcomes[this.identity.playerId];
            const earned = Number(mine.earnedPoints || 0);
            this.game.playerScore = Number(this.game.playerScoreBeforeReveal || 0) + earned;
            this.game.playerDisplayedScore = this.game.isScoreMasked
              ? Math.trunc(Number(this.game.playerScore || 0) / 2)
              : Number(this.game.playerScore || 0);

            this.game.correctStreak = Number(mine.streak || this.game.correctStreak || 0);
            this.game.longestStreak = Number(mine.longestStreak || this.game.longestStreak || 0);
            if (this.game.streakPrizeAvailable) {
              this.game.streakPrizeNotice = "Fight Quiz Streak Prize unlocked.";
            }
            this.game.doubleDownArmed = false;
          }
          this.refreshDoubleDownPolicy();
        }

        handleDoubleDownSet(payload) {
          if (!payload || payload.playerId !== this.identity.playerId) return;
          this.game.doubleDownArmed = !!payload.active;
          this.game.doubleDownUses = Number(payload.doubleDownUses || this.game.doubleDownUses || 0);
          this.game.doubleDownCap = Number(payload.doubleDownCap || this.game.doubleDownCap || 3);
          this.game.doubleDownPurchasedCredits = Number(payload.purchasedCredits || this.game.doubleDownPurchasedCredits || 0);
          this.game.canBuyDoubleDown = !!payload.canBuyDoubleDown;
          this.game.doubleDownBuyCost = Number(payload.buyCost || this.game.doubleDownBuyCost || 3000);
          this.game.doubleDownBuyBlockedReason = String(payload.buyBlockedReason || this.game.doubleDownBuyBlockedReason || "");
          if (payload.rank != null) this.game.rank = Number(payload.rank);
          if (payload.totalPlayers != null) this.game.totalPlayers = Number(payload.totalPlayers);
          this.game.doubleDownNotice = payload.reason ? String(payload.reason) : "";
          this.refreshDoubleDownPolicy(payload.reason || "");
        }

        handleDoubleDownBuyResult(payload) {
          if (!payload || payload.playerId !== this.identity.playerId) return;
          this.game.doubleDownNotice = payload.reason ? String(payload.reason) : "";
          if (payload.score != null) this.game.playerScore = Number(payload.score);
          if (payload.rank != null) this.game.rank = Number(payload.rank);
          if (payload.totalPlayers != null) this.game.totalPlayers = Number(payload.totalPlayers);
          if (payload.doubleDownUses != null) this.game.doubleDownUses = Number(payload.doubleDownUses);
          if (payload.doubleDownCap != null) this.game.doubleDownCap = Number(payload.doubleDownCap);
          if (payload.purchasedCredits != null) this.game.doubleDownPurchasedCredits = Number(payload.purchasedCredits);
          if (payload.canBuyDoubleDown != null) this.game.canBuyDoubleDown = !!payload.canBuyDoubleDown;
          if (payload.buyCost != null) this.game.doubleDownBuyCost = Number(payload.buyCost);
          if (payload.buyBlockedReason != null) this.game.doubleDownBuyBlockedReason = String(payload.buyBlockedReason || "");
          this.refreshDoubleDownPolicy(this.game.doubleDownNotice || "");
        }

        handlePointShieldBuyResult(payload) {
          if (!payload || payload.playerId !== this.identity.playerId) return;
          this.game.pointShieldNotice = payload.reason ? String(payload.reason) : "";
          if (payload.score != null) this.game.playerScore = Number(payload.score);
          if (payload.cost != null) this.game.pointShieldCost = Number(payload.cost);
          if (payload.mode != null) this.game.pointShieldMode = String(payload.mode || "NORMAL");
          if (payload.pointShieldNext != null) this.game.pointShieldNext = !!payload.pointShieldNext;
          if (payload.nextQuestionIndex != null) this.game.pointShieldArmedForQuestionIndex = Number(payload.nextQuestionIndex);
          if (payload.hasNextQuestion === false) this.game.pointShieldArmedForQuestionIndex = null;
          if (payload.canBuyPointShield != null) this.game.canBuyPointShield = !!payload.canBuyPointShield;
          if (payload.canBuyReflectiveShield != null) this.game.canBuyReflectiveShield = !!payload.canBuyReflectiveShield;
          if (payload.reflectiveShieldCost != null) this.game.reflectiveShieldCost = Number(payload.reflectiveShieldCost);
          this.refreshDoubleDownPolicy(this.game.doubleDownNotice || "");
        }

        handleStreakPrizeResult(payload) {
          if (!payload || payload.playerId !== this.identity.playerId) return;
          this.game.streakPrizeNotice = payload.reason ? String(payload.reason) : "";
          if (payload.realScore != null) this.game.playerScore = Number(payload.realScore);
          if (payload.displayedScore != null) this.game.playerDisplayedScore = Number(payload.displayedScore);
          this.game.isScoreMasked = !!payload.isScoreMasked;
          this.game.fakeScoreTurnsRemaining = Number(payload.fakeScoreTurnsRemaining || 0);
          this.game.fakeScorePrimed = !!payload.fakeScorePrimed;
          this.game.streakPrizeAvailable = !!payload.streakPrizeAvailable;
          this.game.streakPrizeUsed = !!payload.streakPrizeUsed;
          this.game.streakPrizeUses = Number(payload.streakPrizeUses || this.game.streakPrizeUses || 0);
          this.game.streakPrizeNextIndex = Number(payload.streakPrizeNextIndex || this.game.streakPrizeNextIndex || 0);
          this.game.streakPrizeAction = String(payload.streakPrizeAction || payload.action || this.game.streakPrizeAction || "");
          this.refreshDoubleDownPolicy();
          this.persist();
          this.render();
        }

        handleLeaderboard(payload) {
          this.game.phase = PHASES.LEADERBOARD;
          this.game.leaderboard = payload && Array.isArray(payload.leaderboard) ? payload.leaderboard : this.game.leaderboard;
          this.game.totalPlayers = Array.isArray(this.game.leaderboard) ? this.game.leaderboard.length : this.game.totalPlayers;
          this.game.prizeTargets = this.game.leaderboard
            .filter((x) => x && x.playerId !== this.identity.playerId)
            .map((x) => ({ playerId: x.playerId, playerName: x.playerName }));
          const mine = this.game.leaderboard.find((x) => x.playerId === this.identity.playerId);
          this.game.rank = mine ? mine.rank : this.game.rank;
          if (mine) {
            this.game.playerDisplayedScore = Number(mine.score || this.game.playerDisplayedScore || this.game.playerScore || 0);
            this.game.incomingStrikeCount = Number(mine.incomingStrikeCount || 0);
            this.game.attackedCount = Number(mine.attackedCount || this.game.attackedCount || 0);
            this.game.strikeOutcome = String(mine.strikeOutcome || "");
            this.game.strikeDelta = Number(mine.strikeDelta || 0);
            this.game.strikeCount = Number(mine.strikeCount || 0);
            this.game.strikeNotice = this.buildStrikeNotice(this.game.strikeOutcome, this.game.strikeDelta, this.game.strikeCount);
            this.game.canBuyPointShield = !!mine.canBuyPointShield;
            this.game.canBuyReflectiveShield = !!mine.canBuyReflectiveShield;
            if (mine.pointShieldNext != null) this.game.pointShieldNext = !!mine.pointShieldNext;
            if (mine.pointShieldMode != null) this.game.pointShieldMode = String(mine.pointShieldMode);
            if (mine.streakPrizeReady != null) this.game.streakPrizeAvailable = !!mine.streakPrizeReady;
            this.game.correctStreak = Number(mine.currentStreak || mine.streak || this.game.correctStreak || 0);
            this.game.longestStreak = Number(mine.longestStreak || this.game.longestStreak || 0);
            if (!mine.shieldActive && this.game.pointShieldArmedForQuestionIndex != null && this.game.question && Number(this.game.pointShieldArmedForQuestionIndex) <= Number(this.game.question.questionIndex || 0)) {
              this.game.pointShieldArmedForQuestionIndex = null;
            }
            if (!this.game.isScoreMasked) {
              this.game.playerScore = Number(mine.score || this.game.playerScore || 0);
            }
          }
          this.game.hasSubmitted = false;
          this.game.selectedIds = [];
          this.refreshDoubleDownPolicy();
        }

        handleScoreUpdated(payload) {
          if (!payload || !Array.isArray(payload.leaderboard)) return;
          this.game.leaderboard = payload.leaderboard;
          this.game.totalPlayers = payload.leaderboard.length;
          this.game.prizeTargets = payload.leaderboard
            .filter((x) => x && x.playerId !== this.identity.playerId)
            .map((x) => ({ playerId: x.playerId, playerName: x.playerName }));
          const mine = payload.leaderboard.find((x) => x.playerId === this.identity.playerId);
          if (mine) {
            this.game.rank = mine.rank;
            this.game.playerDisplayedScore = Number(mine.score || this.game.playerDisplayedScore || this.game.playerScore || 0);
            this.game.incomingStrikeCount = Number(mine.incomingStrikeCount || 0);
            this.game.attackedCount = Number(mine.attackedCount || this.game.attackedCount || 0);
            this.game.strikeOutcome = String(mine.strikeOutcome || "");
            this.game.strikeDelta = Number(mine.strikeDelta || 0);
            this.game.strikeCount = Number(mine.strikeCount || 0);
            this.game.strikeNotice = this.buildStrikeNotice(this.game.strikeOutcome, this.game.strikeDelta, this.game.strikeCount);
            this.game.canBuyPointShield = !!mine.canBuyPointShield;
            this.game.canBuyReflectiveShield = !!mine.canBuyReflectiveShield;
            if (mine.pointShieldNext != null) this.game.pointShieldNext = !!mine.pointShieldNext;
            if (mine.pointShieldMode != null) this.game.pointShieldMode = String(mine.pointShieldMode);
            if (mine.streakPrizeReady != null) this.game.streakPrizeAvailable = !!mine.streakPrizeReady;
            this.game.correctStreak = Number(mine.currentStreak || mine.streak || this.game.correctStreak || 0);
            this.game.longestStreak = Number(mine.longestStreak || this.game.longestStreak || 0);
            if (!this.game.isScoreMasked) {
              this.game.playerScore = Number(mine.score || this.game.playerScore || 0);
            }
          }
          this.refreshDoubleDownPolicy();
        }

        handleScoreReset(payload) {
          if (!payload || payload.playerId !== this.identity.playerId) return;
          this.game.playerScore = 0;
          this.game.playerDisplayedScore = 0;
          this.game.isScoreMasked = false;
          this.game.fakeScoreTurnsRemaining = 0;
          this.game.fakeScorePrimed = false;
          if (payload.streakPrizeAvailable != null) this.game.streakPrizeAvailable = !!payload.streakPrizeAvailable;
          if (payload.streakPrizeUsed != null) this.game.streakPrizeUsed = !!payload.streakPrizeUsed;
          this.game.streakPrizeAction = "";
          this.game.streakPrizeNotice = "";
          if (payload.doubleDownUses != null) this.game.doubleDownUses = Number(payload.doubleDownUses);
          if (payload.doubleDownCap != null) this.game.doubleDownCap = Number(payload.doubleDownCap);
          if (payload.purchasedCredits != null) this.game.doubleDownPurchasedCredits = Number(payload.purchasedCredits);
          if (payload.buyCost != null) this.game.doubleDownBuyCost = Number(payload.buyCost);
          if (payload.pointShieldNext != null) this.game.pointShieldNext = !!payload.pointShieldNext;
          if (payload.pointShieldMode != null) this.game.pointShieldMode = String(payload.pointShieldMode || "NORMAL");
          if (payload.pointShieldArmedForQuestionIndex != null) this.game.pointShieldArmedForQuestionIndex = Number(payload.pointShieldArmedForQuestionIndex);
          if (payload.pointShieldCost != null) this.game.pointShieldCost = Number(payload.pointShieldCost);
          if (payload.reflectiveShieldCost != null) this.game.reflectiveShieldCost = Number(payload.reflectiveShieldCost);
          this.game.canBuyPointShield = false;
          this.game.canBuyReflectiveShield = false;
          this.game.pointShieldNotice = "";
          this.game.incomingStrikeCount = 0;
          this.game.attackedCount = 0;
          this.game.strikeOutcome = "";
          this.game.strikeDelta = 0;
          this.game.strikeCount = 0;
          this.game.strikeNotice = "";
          this.game.correctStreak = 0;
          this.game.longestStreak = 0;
          this.refreshDoubleDownPolicy();
        }

        handleGameFinished(payload) {
          this.game.phase = PHASES.FINISHED;
          if (payload && Array.isArray(payload.leaderboard)) {
            this.game.leaderboard = payload.leaderboard;
            this.game.totalPlayers = payload.leaderboard.length;
            const mine = payload.leaderboard.find((x) => x.playerId === this.identity.playerId);
            if (mine) {
              this.game.rank = mine.rank;
              this.game.playerScore = Number(mine.score || this.game.playerScore || 0);
              this.game.playerDisplayedScore = Number(mine.score || this.game.playerDisplayedScore || this.game.playerScore || 0);
              this.game.correctStreak = Number(mine.currentStreak || mine.streak || this.game.correctStreak || 0);
              this.game.longestStreak = Number(mine.longestStreak || this.game.longestStreak || 0);
            }
          }
          this.game.isScoreMasked = false;
          this.game.fakeScoreTurnsRemaining = 0;
          this.game.fakeScorePrimed = false;
          this.game.pointShieldNext = false;
          this.game.pointShieldMode = "NORMAL";
          this.game.pointShieldArmedForQuestionIndex = null;
          this.game.canBuyPointShield = false;
          this.game.canBuyReflectiveShield = false;
          this.game.strikeOutcome = "";
          this.game.strikeDelta = 0;
          this.game.strikeCount = 0;
          this.game.strikeNotice = "";
          this.refreshDoubleDownPolicy();
        }

        handlePlayerRemoved(payload) {
          if (!payload) return;
          if (payload.playerId === this.identity.playerId) {
            this.game.playerRemoved = true;
          }
        }

        currentQuestionIsMulti() {
          if (!this.game.reveal && this.game.question && this.game.question.options) {
            if (this.game.reveal && Array.isArray(this.game.reveal.correctOptionIds)) {
              return this.game.reveal.correctOptionIds.length > 1;
            }
            return this.game.question.options.length > 0 && this.game.question.options.some(function () { return true; });
          }
          if (this.game.reveal && Array.isArray(this.game.reveal.correctOptionIds)) {
            return this.game.reveal.correctOptionIds.length > 1;
          }
          return false;
        }

        onOptionClick(optionId) {
          if (this.game.phase !== PHASES.QUESTION || this.game.hasSubmitted || !this.game.question) return;
          const question = this.game.question;
          const valid = new Set((question.options || []).map((o) => o.id));
          if (!valid.has(optionId)) return;

          const isMulti = this.isLikelyMultiSelect();
          if (!isMulti) {
            this.game.selectedIds = [optionId];
            this.submitAnswer([optionId]);
            return;
          }

          const set = new Set(this.game.selectedIds || []);
          if (set.has(optionId)) set.delete(optionId);
          else set.add(optionId);
          this.game.selectedIds = Array.from(set);
          this.persist();
          this.render();
        }

        isLikelyMultiSelect() {
          return !!(this.game.question && this.game.question.isMultiSelect);
        }

        onSubmitMulti() {
          if (this.game.phase !== PHASES.QUESTION || this.game.hasSubmitted) return;
          const selected = this.game.selectedIds || [];
          if (!selected.length) return;
          this.submitAnswer(selected);
        }

        onDoubleDown() {
          if (this.game.doubleDownArmed) return;
          if (!this.identity.gameId) return;
          this.refreshDoubleDownPolicy();
          if (!this.game.doubleDownEligible) {
            if (this.game.rank == null) {
              this.send(MSG.DOUBLE_DOWN_NEXT, this.identity.gameId, {
                playerId: this.identity.playerId
              });
              return;
            }
            this.game.doubleDownNotice = this.game.doubleDownDisabledReason || "Double Down is currently disabled.";
            this.persist();
            this.render();
            return;
          }
          this.game.doubleDownNotice = "";
          this.send(MSG.DOUBLE_DOWN_NEXT, this.identity.gameId, {
            playerId: this.identity.playerId
          });
        }

        onBuyDoubleDown() {
          if (!this.identity.gameId) return;
          this.refreshDoubleDownPolicy();
          if (!this.game.canBuyDoubleDown) {
            this.game.doubleDownNotice = this.game.doubleDownBuyBlockedReason || "Double Down purchase is unavailable right now.";
            this.persist();
            this.render();
            return;
          }
          this.send(MSG.DOUBLE_DOWN_BUY, this.identity.gameId, {
            playerId: this.identity.playerId
          });
        }

        onBuyPointShield(mode) {
          const shieldMode = String(mode || "NORMAL").toUpperCase() === "REFLECTIVE" ? "REFLECTIVE" : "NORMAL";
          if (!this.identity.gameId) return;
          const hasNextQuestion = this.game.question && this.game.question.questionNumber < this.game.question.questionCount;
          const cost = shieldMode === "REFLECTIVE"
            ? Math.max(1, Number(this.game.reflectiveShieldCost || 4000))
            : Math.max(1, Number(this.game.pointShieldCost || 2500));

          if (!hasNextQuestion) {
            this.game.pointShieldNotice = "No next question remains for shield activation.";
            this.persist();
            this.render();
            return;
          }

          if (this.game.pointShieldNext) {
            this.game.pointShieldNotice = "Shield is already armed for the next question.";
            this.persist();
            this.render();
            return;
          }

          if (shieldMode === "REFLECTIVE" && !this.game.canBuyReflectiveShield) {
            this.game.pointShieldNotice = this.getReflectiveShieldStatusText(true);
            this.persist();
            this.render();
            return;
          }

          if (shieldMode !== "REFLECTIVE" && !this.game.canBuyPointShield) {
            this.game.pointShieldNotice = this.getPointShieldStatusText(true);
            this.persist();
            this.render();
            return;
          }

          if (Number(this.game.playerScore || 0) < cost) {
            this.game.pointShieldNotice = "Need at least " + formatScore(cost) + " points to arm shield.";
            this.persist();
            this.render();
            return;
          }

          this.game.pointShieldNotice = "";
          this.send(MSG.POINT_SHIELD_BUY, this.identity.gameId, {
            playerId: this.identity.playerId,
            mode: shieldMode
          });
        }

        onClaimStreakPrize(action, targetPlayerId) {
          if (!this.identity.gameId) return;
          if (!this.game.streakPrizeAvailable) {
            this.game.streakPrizeNotice = "This prize is unavailable.";
            this.persist();
            this.render();
            return;
          }
          const chosen = String(action || "").toUpperCase();
          if (chosen !== STREAK_ACTION.MASK && chosen !== STREAK_ACTION.STEAL && chosen !== STREAK_ACTION.BONUS) {
            this.game.streakPrizeNotice = "Choose a prize action first.";
            this.persist();
            this.render();
            return;
          }
          if (chosen === STREAK_ACTION.STEAL && !targetPlayerId) {
            this.game.streakPrizeNotice = "Choose a player to target first.";
            this.persist();
            this.render();
            return;
          }
          this.game.streakPrizeNotice = "";
          this.send(MSG.STREAK_PRIZE_CLAIM, this.identity.gameId, {
            playerId: this.identity.playerId,
            action: chosen,
            targetPlayerId: chosen === STREAK_ACTION.STEAL ? String(targetPlayerId || "") : ""
          });
        }

        joinAnotherGame() {
          if (this.joinTimeoutHandle) {
            clearTimeout(this.joinTimeoutHandle);
            this.joinTimeoutHandle = null;
          }
          this.identity.gameId = "";
          this.game.gameId = "";
          this.game.phase = PHASES.LOBBY;
          this.game.question = null;
          this.game.reveal = null;
          this.game.leaderboard = [];
          this.game.rank = null;
          this.game.hasSubmitted = false;
          this.game.selectedIds = [];
          this.game.playerRemoved = false;
          this.game.doubleDownArmed = false;
          this.game.doubleDownUses = 0;
          this.game.doubleDownCap = 3;
          this.game.doubleDownPurchasedCredits = 0;
          this.game.doubleDownEligible = true;
          this.game.doubleDownDisabledReason = "";
          this.game.doubleDownNotice = "";
          this.game.canBuyDoubleDown = false;
          this.game.doubleDownBuyCost = 3000;
          this.game.doubleDownBuyBlockedReason = "";
          this.game.pointShieldNext = false;
          this.game.pointShieldMode = "NORMAL";
          this.game.pointShieldArmedForQuestionIndex = null;
          this.game.canBuyPointShield = false;
          this.game.pointShieldCost = 2500;
          this.game.canBuyReflectiveShield = false;
          this.game.reflectiveShieldCost = 4000;
          this.game.pointShieldNotice = "";
          this.game.incomingStrikeCount = 0;
          this.game.strikeOutcome = "";
          this.game.strikeDelta = 0;
          this.game.strikeCount = 0;
          this.game.strikeNotice = "";
          this.game.playerDisplayedScore = 0;
          this.game.isScoreMasked = false;
          this.game.fakeScoreTurnsRemaining = 0;
          this.game.fakeScorePrimed = false;
          this.game.correctStreak = 0;
          this.game.longestStreak = 0;
          this.game.streakPrizeAvailable = false;
          this.game.streakPrizeUsed = false;
          this.game.streakPrizeUses = 0;
          this.game.streakPrizeNextIndex = 0;
          this.game.streakPrizeAction = "";
          this.game.streakPrizeNotice = "";
          this.game.prizeTargets = [];
          this.game.totalPlayers = 0;
          this.joinDraft.gameId = "";
          this.resetSorts();
          this.persist();
          this.render();
        }

        submitAnswer(selectedIds) {
          if (this.game.hasSubmitted) return;
          const unique = Array.from(new Set(selectedIds)).sort();
          this.send(MSG.ANSWER_SUBMITTED, this.game.gameId, {
            playerId: this.identity.playerId,
            questionIndex: Number(this.game.question.questionIndex),
            selectedOptionIds: unique,
            submittedAt: nowTs()
          });
          this.game.hasSubmitted = true;
          this.game.selectedIds = unique;
          this.persist();
          this.render();
        }

        persist() {
          LocalStore.writeJson(STORAGE_KEYS.IDENTITY, this.identity);
          LocalStore.writeJson(STORAGE_KEYS.GAME, this.game);
        }

        render(joinMsg) {
          const quoteSet = quoteSetForPhase(this.game && this.game.phase ? this.game.phase : PHASES.LOBBY);

          if (this.game.playerRemoved) {
            this.ui.setFooterQuote(quoteSet.footer);
            this.ui.setNewFightVisible(true, () => this.joinAnotherGame());
            this.ui.renderRemoved();
            return;
          }

          if (!this.identity.playerName || !this.identity.gameId) {
            this.ui.setFooterQuote("");
            this.ui.setNewFightVisible(false);
            this.ui.renderJoin(this.joinDraft.gameId || this.game.gameId || readQueryGame(), this.joinDraft.playerName || this.identity.playerName || "", {
              onJoin: this.onJoin.bind(this),
              onJoinInputChange: this.onJoinInputChange.bind(this)
            }, joinMsg || "", quoteSet);
            return;
          }

          if (this.currentConnState !== "connected" && this.game.phase !== PHASES.QUESTION) {
            this.ui.setFooterQuote(quoteSet.footer);
            this.ui.setNewFightVisible(true, () => this.joinAnotherGame());
            this.ui.renderWaiting("Your connection was interrupted. Reconnecting...", quoteSet);
            return;
          }

          switch (this.game.phase) {
            case PHASES.LOBBY:
              this.ui.setFooterQuote(quoteSet.footer);
              this.ui.setNewFightVisible(true, () => this.joinAnotherGame());
              this.ui.renderLobby(this.game, quoteSet);
              break;
            case PHASES.QUESTION:
              this.ui.setFooterQuote(quoteSet.footer);
              this.ui.setNewFightVisible(true, () => this.joinAnotherGame());
              if (!this.game.question) {
                this.ui.renderWaiting("Waiting for the current question...", quoteSet);
                break;
              }
              this.ui.renderQuestion({
                question: this.game.question,
                hasSubmitted: this.game.hasSubmitted,
                selectedIds: this.game.selectedIds,
                playerScore: this.game.playerScore,
                strikeNotice: this.game.strikeNotice || "",
                playerId: this.identity.playerId,
                isMulti: this.isLikelyMultiSelect(),
                doubleDownActive: this.game.doubleDownArmed
              }, {
                onOptionClick: this.onOptionClick.bind(this),
                onSubmitMulti: this.onSubmitMulti.bind(this)
              });
              break;
            case PHASES.ANSWER_REVEAL:
              this.ui.setFooterQuote(quoteSet.footer);
              this.ui.setNewFightVisible(true, () => this.joinAnotherGame());
              if (!this.game.question || !this.game.reveal) {
                this.ui.renderWaiting("Answer reveal incoming...", quoteSet);
                break;
              }
              this.refreshDoubleDownPolicy(this.game.doubleDownNotice || this.game.doubleDownDisabledReason || "");
              const hasNextQuestion = this.game.question && this.game.question.questionNumber < this.game.question.questionCount;
              this.ui.renderReveal({
                reveal: this.game.reveal,
                question: this.game.question,
                playerId: this.identity.playerId,
                playerScore: this.game.playerScore,
                playerDisplayedScore: this.game.playerDisplayedScore,
                isScoreMasked: !!this.game.isScoreMasked,
                fakeScoreTurnsRemaining: Number(this.game.fakeScoreTurnsRemaining || 0),
                strikeNotice: this.game.strikeNotice || "",
                playerScoreBeforeReveal: this.game.playerScoreBeforeReveal,
                streakPrizeAvailable: !!this.game.streakPrizeAvailable,
                streakPrizeUsed: !!this.game.streakPrizeUsed,
                streakPrizeNotice: this.game.streakPrizeNotice || "",
                prizeTargets: Array.isArray(this.game.prizeTargets) ? this.game.prizeTargets : [],
                doubleDownArmed: this.game.doubleDownArmed,
                doubleDownEligible: !!this.game.doubleDownEligible,
                doubleDownDisabledReason: this.game.doubleDownNotice || this.game.doubleDownDisabledReason || "",
                doubleDownStatusText: this.getDoubleDownStatusText(hasNextQuestion),
                doubleDownUses: Number(this.game.doubleDownUses || 0),
                doubleDownCap: Number(this.game.doubleDownCap || 3),
                rank: this.game.rank,
                canBuyDoubleDown: !!this.game.canBuyDoubleDown,
                doubleDownBuyCost: Number(this.game.doubleDownBuyCost || 3000),
                doubleDownBuyBlockedReason: this.game.doubleDownBuyBlockedReason || "",
                pointShieldNext: !!this.game.pointShieldNext,
                pointShieldMode: String(this.game.pointShieldMode || "NORMAL"),
                canBuyPointShield: !!this.game.canBuyPointShield,
                pointShieldCost: Number(this.game.pointShieldCost || 2500),
                canBuyReflectiveShield: !!this.game.canBuyReflectiveShield,
                reflectiveShieldCost: Number(this.game.reflectiveShieldCost || 4000),
                pointShieldNotice: this.game.pointShieldNotice || "",
                incomingStrikeCount: Number(this.game.incomingStrikeCount || 0),
                pointShieldStatusText: this.getPointShieldStatusText(hasNextQuestion),
                reflectiveShieldStatusText: this.getReflectiveShieldStatusText(hasNextQuestion),
                hasNextQuestion,
                onDoubleDown: this.onDoubleDown.bind(this),
                onBuyDoubleDown: this.onBuyDoubleDown.bind(this),
                onBuyPointShield: this.onBuyPointShield.bind(this),
                onClaimStreakPrize: this.onClaimStreakPrize.bind(this)
              });
              break;
            case PHASES.LEADERBOARD:
            case PHASES.FINISHED:
              this.ui.setFooterQuote(quoteSet.footer);
              this.ui.setNewFightVisible(true, () => this.joinAnotherGame());
              const hasNextFromBoard = !!(this.game.question && this.game.question.questionNumber < this.game.question.questionCount);
              const stageStats = this.buildLeaderboardStats(Array.isArray(this.game.leaderboard) ? this.game.leaderboard : []);
              this.ui.renderLeaderboard({
                phase: this.game.phase,
                leaderboard: this.game.leaderboard,
                scoreRankRows: stageStats.scoreRankRows,
                leaderboardRows: stageStats.leaderboardRows,
                quickDrawRows: stageStats.quickDrawRows,
                leaderboardSort: stageStats.leaderboardSort,
                quickDrawSort: stageStats.quickDrawSort,
                rank: this.game.rank,
                playerScore: this.game.playerScore,
                playerDisplayedScore: this.game.playerDisplayedScore,
                isScoreMasked: this.game.isScoreMasked,
                fakeScoreTurnsRemaining: this.game.fakeScoreTurnsRemaining,
                strikeNotice: this.game.strikeNotice || "",
                correctStreak: Number(this.game.correctStreak || 0),
                longestStreak: Number(this.game.longestStreak || 0),
                streakPrizeUsed: this.game.streakPrizeUsed,
                streakPrizeUses: Number(this.game.streakPrizeUses || 0),
                streakPrizeAction: this.game.streakPrizeAction,
                streakPrizeAvailable: this.game.streakPrizeAvailable,
                streakPrizeNotice: this.game.streakPrizeNotice || "",
                prizeTargets: Array.isArray(this.game.prizeTargets) ? this.game.prizeTargets : [],
                pointShieldNext: !!this.game.pointShieldNext,
                pointShieldMode: String(this.game.pointShieldMode || "NORMAL"),
                canBuyPointShield: !!this.game.canBuyPointShield,
                pointShieldCost: Number(this.game.pointShieldCost || 2500),
                canBuyReflectiveShield: !!this.game.canBuyReflectiveShield,
                reflectiveShieldCost: Number(this.game.reflectiveShieldCost || 4000),
                pointShieldNotice: this.game.pointShieldNotice || "",
                pointShieldStatusText: this.getPointShieldStatusText(hasNextFromBoard),
                reflectiveShieldStatusText: this.getReflectiveShieldStatusText(hasNextFromBoard),
                question: this.game.question,
                onBuyPointShield: this.onBuyPointShield.bind(this),
                onClaimStreakPrize: this.onClaimStreakPrize.bind(this),
                onSortLeaderboard: (key) => {
                  this.toggleSortState("leaderboard", key);
                  this.render();
                },
                onSortQuickDraw: (key) => {
                  this.toggleSortState("quickdraw", key);
                  this.render();
                },
                onResetSorts: () => {
                  this.resetSorts();
                  this.render();
                }
              }, quoteSet);
              break;
            default:
              this.ui.setFooterQuote(quoteSet.footer);
              this.ui.setNewFightVisible(true, () => this.joinAnotherGame());
              this.ui.renderWaiting("Waiting for the instructor...", quoteSet);
          }
        }

        startTicker() {
          this.tickTimer = setInterval(() => {
            if (this.game.phase === PHASES.QUESTION && this.game.question) {
              this.ui.refreshTimer(this.game.question);
              if (nowTs() > this.game.question.endsAt + 1200 && !this.game.reveal) {
                this.ui.renderWaiting("Question closed. Waiting for answer reveal...");
              }
            }
          }, 300);
        }

        spawnFloaters() {
          const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (reduce) return;
          const layer = document.getElementById("floatLayer");
          for (let i = 0; i < 22; i += 1) {
            const d = document.createElement("div");
            d.className = "floater";
            const size = 8 + Math.floor(Math.random() * 34);
            d.style.width = size + "px";
            d.style.height = size + "px";
            d.style.left = Math.floor(Math.random() * 100) + "vw";
            d.style.bottom = (-70 - Math.floor(Math.random() * 260)) + "px";
            d.style.animationDuration = (17 + Math.random() * 16) + "s";
            d.style.animationDelay = (-Math.random() * 12) + "s";
            layer.appendChild(d);
          }
        }
      }

      const app = new StudentGameController();
      app.init();
    })();
  </script>
</body>
</html>
