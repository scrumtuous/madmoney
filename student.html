<!DOCTYPE html>
<!-- student.html: Player interface for joining, answering, and following the live Fight Quiz multiplayer game. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fight Quiz | On a long enough timeline, the survival rate for every quiz drops to zero</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet" />
  <style>
    :root {
      --night: #0f0b16;
      --plum-dark: #21142b;
      --plum-mid: #3a2148;
      --rose: #d392b2;
      --lavender: #c8afd9;
      --pink: #f7dde9;
      --silver: #d2d5e0;
      --danger: #ff6b88;
      --ok: #56d79f;
      --warn: #ff9d74;
      --card: rgba(29, 18, 38, 0.82);
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
      --radius: 20px;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--pink);
      font-family: "Nunito Sans", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(211, 146, 178, 0.28), transparent 28%),
        radial-gradient(circle at 82% 24%, rgba(200, 175, 217, 0.23), transparent 30%),
        radial-gradient(circle at 50% 78%, rgba(211, 146, 178, 0.15), transparent 36%),
        linear-gradient(165deg, var(--night), var(--plum-dark) 44%, var(--plum-mid));
      overflow-x: hidden;
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 0.9rem;
      position: relative;
      z-index: 1;
    }

    .title-font {
      font-family: "Nunito Sans", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .glass {
      background: var(--card);
      border: 1px solid rgba(247, 221, 233, 0.24);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .small-note { color: rgba(247, 221, 233, 0.82); }

    .fight-creed {
      border: 1px solid rgba(247, 221, 233, 0.16);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.55rem 0.65rem;
      font-size: 0.82rem;
      line-height: 1.35;
      color: rgba(247, 221, 233, 0.8);
    }

    .landing-card {
      position: relative;
      overflow: hidden;
    }

    .landing-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("fight-landing-bg.svg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      opacity: 0.08;
      filter: contrast(0.95);
      pointer-events: none;
      z-index: 0;
    }

    .landing-card > * {
      position: relative;
      z-index: 1;
    }

    .conn-badge {
      border-radius: 999px;
      border: 1px solid rgba(210, 213, 224, 0.3);
      padding: 0.3rem 0.7rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #888;
    }

    .dot.connected { background: var(--ok); box-shadow: 0 0 12px rgba(86, 215, 159, 0.65); }
    .dot.reconnecting { background: var(--warn); box-shadow: 0 0 12px rgba(255, 157, 116, 0.65); }
    .dot.disconnected { background: var(--danger); box-shadow: 0 0 12px rgba(255, 107, 136, 0.65); }

    .moon-btn {
      border-radius: 14px;
      border: 1px solid rgba(247, 221, 233, 0.35);
      color: var(--pink);
      background: linear-gradient(140deg, rgba(163, 96, 132, 0.45), rgba(92, 61, 124, 0.42));
      font-weight: 800;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    .moon-btn:hover,
    .moon-btn:focus-visible {
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 9px 20px rgba(211, 146, 178, 0.33);
    }

    .moon-btn:disabled {
      opacity: 0.5;
      transform: none;
      box-shadow: none;
    }

    .outline-moon {
      border-radius: 14px;
      border: 1px solid rgba(247, 221, 233, 0.35);
      color: var(--pink);
      background: transparent;
      font-weight: 700;
    }

    .join-input,
    .join-input:focus {
      border-radius: 12px;
      background: rgba(8, 6, 12, 0.65);
      color: #fff;
      border-color: rgba(247, 221, 233, 0.35);
      box-shadow: 0 0 0 0.12rem rgba(211, 146, 178, 0.2);
    }

    .score-box {
      border-radius: 14px;
      border: 1px solid rgba(247, 221, 233, 0.3);
      background: rgba(0, 0, 0, 0.36);
      padding: 0.7rem;
      text-align: center;
    }

    .timer {
      font-family: "Nunito Sans", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 700;
      font-size: clamp(2.1rem, 7vw, 3.5rem);
      text-align: center;
      line-height: 1;
      border: 1px solid rgba(247, 221, 233, 0.45);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.42);
      padding: 0.45rem 0.9rem;
      min-width: 180px;
      margin: 0 auto;
      animation: pulse-soft 1300ms ease-in-out infinite;
    }

    .timer.warn {
      border-color: rgba(255, 157, 116, 0.6);
      color: #ffd4c2;
    }

    .timer.danger {
      border-color: rgba(255, 107, 136, 0.75);
      color: #ffdbe5;
      animation: pulse-hot 760ms ease-in-out infinite;
    }

    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    @keyframes pulse-hot {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 0.7rem;
    }

    @media (min-width: 768px) {
      .options-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .ans-btn {
      text-align: left;
      border: none;
      border-radius: 16px;
      min-height: 88px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      padding: 0.8rem;
      font-weight: 700;
      transition: transform 130ms ease, box-shadow 130ms ease, filter 130ms ease;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .ans-btn .letter {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.7);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.18);
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .ans-btn:hover,
    .ans-btn:focus-visible {
      transform: translateY(-1px) scale(1.01);
      filter: brightness(1.06);
    }

    .ans-btn.selected {
      outline: 3px solid rgba(247, 221, 233, 0.88);
      box-shadow: 0 0 0 4px rgba(247, 221, 233, 0.22), 0 14px 28px rgba(0, 0, 0, 0.45);
      animation: select-glow 680ms ease;
    }

    .ans-btn.locked {
      opacity: 0.64;
      transform: none;
      filter: grayscale(0.12);
    }

    .ans-btn.reveal-wrong {
      background: linear-gradient(145deg, #54545d, #3f3f46) !important;
      filter: grayscale(0.25);
      opacity: 0.66;
    }

    .ans-btn.reveal-correct {
      border: 2px solid rgba(255, 246, 194, 0.95);
      box-shadow: 0 0 0 4px rgba(255, 235, 150, 0.2), 0 0 30px rgba(255, 214, 122, 0.55);
      animation: correct-throb 950ms ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    .ans-btn.reveal-correct:hover,
    .ans-btn.reveal-correct:focus-visible {
      transform: scale(1.03) rotate(-0.4deg);
      filter: brightness(1.12) saturate(1.15);
      box-shadow: 0 0 0 6px rgba(255, 232, 144, 0.24), 0 0 40px rgba(255, 214, 122, 0.8);
    }

    @keyframes correct-throb {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.018); }
    }

    .answer-reveal-blast {
      animation: reveal-blast 700ms cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes reveal-blast {
      0% { transform: scale(0.94); opacity: 0; }
      60% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .confetti-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 14px;
      opacity: 0.95;
      animation: confetti-fall 900ms ease-out forwards;
      border-radius: 2px;
    }

    @keyframes confetti-fall {
      from { transform: translateY(-8px) rotate(0deg); opacity: 1; }
      to { transform: translateY(88px) rotate(320deg); opacity: 0; }
    }

    .double-down-banner {
      border-radius: 12px;
      border: 1px solid rgba(255, 194, 145, 0.8);
      background: rgba(130, 73, 37, 0.28);
      color: #ffe8c5;
      font-weight: 800;
      padding: 0.58rem 0.72rem;
      margin-bottom: 0.8rem;
      animation: danger-throb 920ms ease-in-out infinite;
    }

    @keyframes danger-throb {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 194, 145, 0.28); }
      50% { box-shadow: 0 0 0 8px rgba(255, 194, 145, 0); }
    }

    .double-down-note {
      border-radius: 10px;
      border: 1px solid rgba(247, 221, 233, 0.22);
      background: rgba(0, 0, 0, 0.26);
      color: rgba(247, 221, 233, 0.9);
      padding: 0.55rem 0.65rem;
      font-size: 0.9rem;
      line-height: 1.3;
    }

    .double-down-note.warn {
      border-color: rgba(255, 194, 145, 0.62);
      color: #ffe2c5;
      background: rgba(123, 63, 32, 0.28);
    }

    .double-down-note.ok {
      border-color: rgba(130, 235, 186, 0.52);
      color: #d9ffed;
      background: rgba(30, 96, 71, 0.26);
    }

    .double-down-note.bad {
      border-color: rgba(255, 132, 158, 0.58);
      color: #ffdce7;
      background: rgba(114, 41, 61, 0.32);
    }

    .streak-prize {
      border-radius: 16px;
      border: 2px solid rgba(255, 231, 142, 0.92);
      background: linear-gradient(145deg, rgba(120, 74, 20, 0.38), rgba(98, 45, 26, 0.45));
      box-shadow: 0 0 0 2px rgba(255, 214, 102, 0.2), 0 0 34px rgba(255, 204, 97, 0.35);
      padding: 0.85rem;
      margin-bottom: 0.9rem;
      animation: prize-pop 680ms ease;
    }

    .streak-prize-title {
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #ffeab7;
      font-size: 1.12rem;
    }

    .streak-prize-note {
      color: #fff0d4;
      font-size: 0.92rem;
    }

    @keyframes prize-pop {
      0% { transform: scale(0.96); opacity: 0.3; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes select-glow {
      0% { box-shadow: 0 0 0 0 rgba(247, 221, 233, 0.45); }
      100% { box-shadow: 0 0 0 9px rgba(247, 221, 233, 0); }
    }

    .c-red { background: linear-gradient(145deg, #cc384f, #a12545); }
    .c-green { background: linear-gradient(145deg, #2aa467, #1f8450); }
    .c-blue { background: linear-gradient(145deg, #3377e2, #2b52b9); }
    .c-purple { background: linear-gradient(145deg, #8451cf, #6943af); }
    .c-orange { background: linear-gradient(145deg, #ea7f2b, #ca5e18); }
    .c-pink { background: linear-gradient(145deg, #d14b8d, #a53672); }

    .lock-state {
      border-radius: 12px;
      border: 1px solid rgba(86, 215, 159, 0.5);
      background: rgba(36, 99, 72, 0.2);
      padding: 0.65rem;
      font-weight: 700;
      animation: pop-msg 280ms ease;
    }

    @keyframes pop-msg {
      from { opacity: 0; transform: translateY(6px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .shake {
      animation: wrong-shake 420ms ease;
    }

    @keyframes wrong-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      50% { transform: translateX(7px); }
      75% { transform: translateX(-4px); }
    }

    .celebrate {
      animation: win-pop 520ms ease;
    }

    @keyframes win-pop {
      0% { transform: scale(0.95); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }

    .rank-row {
      border-radius: 12px;
      border: 1px solid rgba(247, 221, 233, 0.2);
      background: rgba(47, 30, 60, 0.75);
      padding: 0.58rem 0.72rem;
      margin-bottom: 0.45rem;
      animation: rise 280ms ease both;
    }

    .final-action-summary {
      border-radius: 14px;
      border: 1px solid rgba(255, 231, 142, 0.58);
      background: linear-gradient(150deg, rgba(102, 64, 28, 0.44), rgba(62, 36, 53, 0.5));
      color: #ffeecd;
      padding: 0.7rem 0.8rem;
      margin-bottom: 0.7rem;
      font-weight: 700;
    }

    .power-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
    }

    .power-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
      border-radius: 999px;
      border: 1px solid rgba(247, 221, 233, 0.26);
      background: rgba(0, 0, 0, 0.28);
      color: rgba(247, 221, 233, 0.92);
      padding: 0.18rem 0.5rem;
      font-size: 0.76rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .power-pill.ready {
      border-color: rgba(255, 224, 144, 0.62);
      color: #ffe7ab;
      background: rgba(123, 78, 27, 0.35);
    }

    .power-pill.shield {
      border-color: rgba(145, 240, 211, 0.58);
      color: #d4fff0;
      background: rgba(25, 95, 73, 0.31);
    }

    .power-pill.rocket {
      border-color: rgba(255, 141, 160, 0.62);
      color: #ffd4dd;
      background: rgba(112, 44, 66, 0.34);
    }

    @keyframes rise {
      from { transform: translateY(6px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .floater {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.22;
      z-index: 0;
      animation: floaty linear infinite;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), rgba(255,255,255,0));
    }

    @keyframes floaty {
      from { transform: translateY(12vh) translateX(0); }
      to { transform: translateY(-120vh) translateX(25px); }
    }

    .focus-ring:focus-visible {
      outline: 2px solid #ffe6ef;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="floatLayer"></div>
  <div class="shell">
    <header class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
      <div>
        <div class="small-note">If this is your first time at Fight Quiz, you have to fight.</div>
      </div>
      <div class="conn-badge"><span id="connDot" class="dot disconnected"></span><span id="connText">Connecting...</span></div>
    </header>

    <main id="app"></main>

    <footer class="small-note text-center mt-3 mb-1"><div id="pageFooterQuote">Quote loading...</div><div>This project has no association with the movie Fight Club.</div></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      "use strict";

      const socketUrl = "ws://10.23.131.137:8099/madmoney";
      const STORAGE_KEYS = {
        IDENTITY: "gothicQuiz.studentIdentity.v1",
        GAME: "gothicQuiz.studentGame.v1"
      };

      const PHASES = {
        LOBBY: "LOBBY",
        QUESTION: "QUESTION",
        ANSWER_REVEAL: "ANSWER_REVEAL",
        LEADERBOARD: "LEADERBOARD",
        FINISHED: "FINISHED"
      };

      const MSG = {
        PLAYER_JOIN: "PLAYER_JOIN",
        PLAYER_REJOIN: "PLAYER_REJOIN",
        PLAYER_JOINED: "PLAYER_JOINED",
        PLAYER_REMOVE: "PLAYER_REMOVE",
        PLAYER_REMOVED: "PLAYER_REMOVED",
        SYNC_REQUEST: "SYNC_REQUEST",
        STATE_SNAPSHOT: "STATE_SNAPSHOT",
        GAME_STARTED: "GAME_STARTED",
        QUESTION_STARTED: "QUESTION_STARTED",
        ANSWER_SUBMITTED: "ANSWER_SUBMITTED",
        QUESTION_ENDED: "QUESTION_ENDED",
        ANSWER_REVEALED: "ANSWER_REVEALED",
        SCORE_UPDATED: "SCORE_UPDATED",
        SCORE_RESET: "SCORE_RESET",
        LEADERBOARD: "LEADERBOARD",
        GAME_FINISHED: "GAME_FINISHED",
        INSTRUCTOR_PRESENT: "INSTRUCTOR_PRESENT",
        DOUBLE_DOWN_NEXT: "DOUBLE_DOWN_NEXT",
        DOUBLE_DOWN_SET: "DOUBLE_DOWN_SET",
        DOUBLE_DOWN_BUY: "DOUBLE_DOWN_BUY",
        DOUBLE_DOWN_BUY_RESULT: "DOUBLE_DOWN_BUY_RESULT",
        POINT_SHIELD_BUY: "POINT_SHIELD_BUY",
        POINT_SHIELD_BUY_RESULT: "POINT_SHIELD_BUY_RESULT",
        STREAK_PRIZE_CLAIM: "STREAK_PRIZE_CLAIM",
        STREAK_PRIZE_RESULT: "STREAK_PRIZE_RESULT"
      };

      const STREAK_ACTION = {
        MASK: "MASK_SELF",
        STEAL: "STEAL_1000",
        BONUS: "BONUS_2000"
      };

      const QUOTES = [
        "You can spend years building a life that never really belonged to you.",
        "Owning more things does not automatically make you more complete.",
        "Sometimes the identity you protect is the thing keeping you trapped.",
        "Comfort can become its own kind of prison.",
        "Fear loses some of its power once you stop running from it.",
        "A perfect apartment cannot fix an empty life.",
        "You learn what matters when the things you relied on disappear.",
        "People often confuse their possessions with their personality.",
        "The safest version of your life may also be the least alive.",
        "Destruction can feel like freedom when everything around you feels fake.",
        "If your whole identity comes from your career, losing the job feels like losing yourself.",
        "Consumer culture is very good at inventing problems it can sell you solutions for.",
        "Sometimes you have to question the person you think you are.",
        "Routine can numb you so gradually that you barely notice it happening.",
        "Pain has a way of making the present moment impossible to ignore.",
        "The desire to control everything often comes from being terrified of chaos.",
        "A life built entirely around approval eventually belongs to everyone except you.",
        "You can follow every rule and still end up completely lost.",
        "The image you show the world can become harder to maintain than the truth.",
        "People will endure incredible discomfort just to feel something authentic.",
        "You are more complicated than your resume, salary, clothes, or apartment.",
        "Sometimes rebellion begins with admitting that the normal path is not working.",
        "Freedom can be frightening because it leaves you responsible for what happens next.",
        "The person you pretend to be can eventually start making decisions for you.",
        "There is something dangerous about believing you have nothing left to lose.",
        "Society rewards obedience more often than self-examination.",
        "The things that make you look successful can still leave you miserable.",
        "Confidence can sometimes be nothing more than refusing to ask permission.",
        "People often seek extreme experiences when ordinary life stops feeling real.",
        "Hitting bottom can destroy you, but it can also destroy your illusions.",
        "The harder you cling to certainty, the more frightening change becomes.",
        "A polished life can hide a tremendous amount of anger.",
        "You cannot purchase a personality one product at a time.",
        "Many people spend their lives performing a version of themselves for strangers.",
        "Sometimes the greatest threat to your identity is discovering that it was invented.",
        "Chaos becomes attractive when order feels meaningless.",
        "Being admired is not the same thing as being understood.",
        "You can be surrounded by people and still feel completely disconnected.",
        "There is a difference between being alive and merely functioning.",
        "The urge to destroy something can come from wanting proof that change is possible.",
        "Most people are taught how to succeed long before they are taught why success matters.",
        "You discover strange things about yourself when the usual distractions disappear.",
        "Losing control can feel liberating right up until you realize you cannot get it back.",
        "Anger can give you direction without giving you wisdom.",
        "A movement built around rejecting conformity can create a new kind of conformity.",
        "The person promising to set you free can become another person telling you what to do.",
        "Rebellion stops being freedom when nobody is allowed to question it.",
        "Escaping one identity does not help if you immediately replace it with another.",
        "The most dangerous ideas are often the ones that make you feel completely certain.",
        "Becoming free requires more than destroying the life you already have. It requires deciding what should replace it.",
        "It's only after we've lost everything that we're free to do anything.",
        "Without pain, without sacrifice, we would have nothing."
      ];

      function pickRandomQuotes(count) {
        const pool = QUOTES.slice();
        const out = [];
        while (pool.length && out.length < count) {
          const idx = Math.floor(Math.random() * pool.length);
          out.push(pool.splice(idx, 1)[0]);
        }
        return out;
      }

      function quoteSetForPhase(phase) {
        const introspective = QUOTES.filter((q) => /comfort|routine|identity|approval|functioning|disconnected|normal path|obedience|personality/i.test(q));
        const pressure = QUOTES.filter((q) => /pain|chaos|fear|anger|destroy|bottom|control|frightening|extreme/i.test(q));
        const resolution = QUOTES.filter((q) => /freedom|replace it|responsible|question|authentic|understood|alive/i.test(q));
        let pool = QUOTES;
        if (phase === PHASES.LOBBY) pool = introspective.length ? introspective : QUOTES;
        else if (phase === PHASES.QUESTION || phase === PHASES.ANSWER_REVEAL) pool = pressure.length ? pressure : QUOTES;
        else if (phase === PHASES.LEADERBOARD || phase === PHASES.FINISHED) pool = resolution.length ? resolution : QUOTES;
        const local = pool.slice();
        const out = [];
        while (local.length && out.length < 5) {
          const idx = Math.floor(Math.random() * local.length);
          out.push(local.splice(idx, 1)[0]);
        }
        while (out.length < 5) {
          const fill = pickRandomQuotes(1)[0] || "";
          if (!fill) break;
          out.push(fill);
        }
        return {
          title: out[0] || "",
          below: out[1] || "",

      function nowTs() { return Date.now(); }
      function generateMessageId() {
        if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
        return "m-" + Math.random().toString(36).slice(2) + "-" + nowTs();
      }
      function formatScore(v) { return Number(v || 0).toLocaleString(); }
      function formatTime(ms) {
        const safe = Math.max(0, ms);
        const sec = Math.floor(safe / 1000);
        const mm = String(Math.floor(sec / 60)).padStart(2, "0");
        const ss = String(sec % 60).padStart(2, "0");
        return mm + ":" + ss;
      }
      function sanitizeName(name) {
        return String(name || "").trim().replace(/\s+/g, " ").slice(0, 30);

      class LocalStore {
        static readJson(key, fallback) {
          try {
            const raw = localStorage.getItem(key);
            if (!raw) return fallback;
            return JSON.parse(raw);
          } catch (err) {
            return fallback;
          }
        }
        static writeJson(key, value) {
          localStorage.setItem(key, JSON.stringify(value));
        }
      }

      class SocketManager {
        constructor(onMessage, onState) {
          this.onMessage = onMessage;
          this.onState = onState;
          this.ws = null;
          this.retries = 0;
          this.manual = false;
          this.seen = new Map();
          this.status = "disconnected";
        }

        connect() {
          this.manual = false;
          this._open();
          if (!this.pruneTimer) {
            this.pruneTimer = setInterval(() => this.pruneSeen(), 9000);
          }
        }

        _open() {
          try {
            this.ws = new WebSocket(socketUrl);
          } catch (err) {
            this.scheduleReconnect();
            return;
          }
          this.onState("connecting");
          this.ws.onopen = () => {
            this.retries = 0;
            this.onState("connected");
          };
          this.ws.onclose = () => {
            if (this.manual) {
              this.onState("disconnected");
              return;
            }
            this.scheduleReconnect();
          };
          this.ws.onerror = () => {
            this.onState("reconnecting");
          };
          this.ws.onmessage = (evt) => {
            const msg = this.parse(evt.data);
            if (!msg) return;
            if (!this.validate(msg)) return;
            if (this.isDup(msg.messageId)) return;
            this.onMessage(msg);
          };
        }

        scheduleReconnect() {
          this.onState("reconnecting");
          const delay = Math.min(10000, 900 * Math.pow(1.6, this.retries));
          this.retries += 1;
          setTimeout(() => {
            if (!this.manual) this._open();
          }, delay);
        }

        close() {
          this.manual = true;
          if (this.pruneTimer) clearInterval(this.pruneTimer);
          if (this.ws) this.ws.close();
        }

        send(message) {
          if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return false;
          this.ws.send(JSON.stringify(message));
          return true;
        }

        parse(raw) {
          try { return JSON.parse(raw); } catch (err) { return null; }
        }

        validate(msg) {
          return !!(msg && typeof msg.type === "string" && typeof msg.messageId === "string" && typeof msg.gameId === "string" && typeof msg.senderRole === "string");
        }

        isDup(id) {
          if (!id) return false;
          if (this.seen.has(id)) return true;
          this.seen.set(id, nowTs());
          if (this.seen.size > 1500) this.pruneSeen(true);
          return false;
        }

        pruneSeen(force) {
          const cutoff = nowTs() - 8 * 60 * 1000;
          for (const [k, v] of this.seen.entries()) {
            if (force || v < cutoff) this.seen.delete(k);
          }
        }
      }

            if (canUseStreakPrize || hasNextQuestion || model.streakPrizeNotice || model.pointShieldNotice) {

                html += "<div class='power-strip'>"

                  + "<span class='power-pill ready'><i class='lni lni-target'></i>Shadow Strike Ready</span>"
                  + "<span class='power-pill ready'><i class='lni lni-bolt'></i>Moon Boost Ready</span>"
                  + "</div>";
                html += "<div class='streak-prize-note mb-2'>Your 5-streak prize is still available. Use it now or save it for later questions.</div>";
                html += "<div class='d-grid gap-2 mb-2'>"
                  + "<select id='lbStreakPrizeAction' class='form-control join-input'>"
                  + "<option value=''>Select prize action...</option>"
                  + "<option value='" + STREAK_ACTION.MASK + "'>Fog Cloak: hide your leaderboard score for 5 turns</option>"
                  + "<option value='" + STREAK_ACTION.STEAL + "'>Shadow Strike: another player loses 1,000</option>"
                  + "<option value='" + STREAK_ACTION.BONUS + "'>Moon Boost: gain 2,000 points</option>"

              if (hasNextQuestion) {

                html += "<button id='lbBuyPointShieldBtn' class='btn moon-btn btn-lg focus-ring w-100 mb-2'"

                html += "<div class='double-down-note " + ((model.pointShieldNext || model.canBuyPointShield) ? "ok" : "bad") + " mb-2'>"

              actions.innerHTML = html;

          const list = document.createElement("div");
          (model.leaderboard || []).forEach((row) => {
            let iconHtml = "";

              iconHtml += "<span class='power-pill ready ms-1'><i class='lni lni-lock-alt'></i></span>";
              iconHtml += "<span class='power-pill ready ms-1'><i class='lni lni-target'></i></span>";
              iconHtml += "<span class='power-pill ready ms-1'><i class='lni lni-bolt'></i></span>";
            }
            if (row.canBuyPointShield || row.pointShieldNext || row.shieldActive) {
              iconHtml += "<span class='power-pill shield ms-1'><i class='lni lni-shield'></i></span>";
