<!DOCTYPE html>
<!-- student.html: Player interface for joining, answering, and following the live Fight Quiz multiplayer game. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fight Quiz | On a long enough timeline, the survival rate for every quiz drops to zero</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet" />
  <style>
    :root {
      --night: #0f0b16;
      --plum-dark: #21142b;
      --plum-mid: #3a2148;
      --rose: #d392b2;
      --lavender: #c8afd9;
      --pink: #f7dde9;
      --silver: #d2d5e0;
      --danger: #ff6b88;
      --ok: #56d79f;
      --warn: #ff9d74;
      --card: rgba(29, 18, 38, 0.82);
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
      --radius: 20px;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--pink);
      font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(211, 146, 178, 0.28), transparent 28%),
        radial-gradient(circle at 82% 24%, rgba(200, 175, 217, 0.23), transparent 30%),
        radial-gradient(circle at 50% 78%, rgba(211, 146, 178, 0.15), transparent 36%),
        linear-gradient(165deg, var(--night), var(--plum-dark) 44%, var(--plum-mid));
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("fight-landing-bg.svg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 0.9rem;
      position: relative;
      z-index: 1;
    }

    .title-font {
      font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 800;
      letter-spacing: 0;
    }

    .glass {
      background: var(--card);
      border: 1px solid rgba(247, 221, 233, 0.24);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .small-note { color: rgba(247, 221, 233, 0.82); }

    .fight-creed {
      border: 1px solid rgba(247, 221, 233, 0.16);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.55rem 0.65rem;
      font-size: 0.82rem;
      line-height: 1.35;
      color: rgba(247, 221, 233, 0.8);
    }

    .landing-card {
      position: relative;
      overflow: hidden;
    }

    .landing-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("fight-landing-bg.svg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      opacity: 0.08;
      filter: contrast(0.95);
      pointer-events: none;
      z-index: 0;
    }

    .landing-card > * {
      position: relative;
      z-index: 1;
    }

    .conn-badge {
      border-radius: 999px;
      border: 1px solid rgba(210, 213, 224, 0.3);
      padding: 0.3rem 0.7rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
    }

    .new-fight-pill {
      border-radius: 999px;
      border: 1px solid rgba(247, 221, 233, 0.4);
      background: rgba(60, 36, 79, 0.7);
      color: #ffe7f0;
      font-weight: 700;
      padding: 0.28rem 0.75rem;
      font-size: 0.84rem;
      line-height: 1.2;
    }

    .new-fight-pill:hover,
    .new-fight-pill:focus-visible {
      color: #fff;
      border-color: rgba(247, 221, 233, 0.6);
      background: rgba(93, 56, 122, 0.8);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #888;
    }

    .dot.connected { background: var(--ok); box-shadow: 0 0 12px rgba(86, 215, 159, 0.65); }
    .dot.reconnecting { background: var(--warn); box-shadow: 0 0 12px rgba(255, 157, 116, 0.65); }
    .dot.disconnected { background: var(--danger); box-shadow: 0 0 12px rgba(255, 107, 136, 0.65); }

    .moon-btn {
      border-radius: 14px;
      border: 1px solid rgba(247, 221, 233, 0.35);
      color: var(--pink);
      background: linear-gradient(140deg, rgba(163, 96, 132, 0.45), rgba(92, 61, 124, 0.42));
      font-weight: 800;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    .moon-btn:hover,
    .moon-btn:focus-visible {
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 9px 20px rgba(211, 146, 178, 0.33);
    }

    .moon-btn:disabled {
      opacity: 0.5;
      transform: none;
      box-shadow: none;
    }

    .outline-moon {
      border-radius: 14px;
      border: 1px solid rgba(247, 221, 233, 0.35);
      color: var(--pink);
      background: transparent;
      font-weight: 700;
    }

    .join-input,
    .join-input:focus {
      border-radius: 12px;
      background: rgba(8, 6, 12, 0.65);
      color: #fff;
      border-color: rgba(247, 221, 233, 0.35);
      box-shadow: 0 0 0 0.12rem rgba(211, 146, 178, 0.2);
    }

    .score-box {
      border-radius: 14px;
      border: 1px solid rgba(247, 221, 233, 0.3);
      background: rgba(0, 0, 0, 0.36);
      padding: 0.7rem;
      text-align: center;
    }

    .timer {
      font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 700;
      font-size: clamp(2.1rem, 7vw, 3.5rem);
      text-align: center;
      line-height: 1;
      border: 1px solid rgba(247, 221, 233, 0.45);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.42);
      padding: 0.45rem 0.9rem;
      min-width: 180px;
      margin: 0 auto;
      animation: pulse-soft 1300ms ease-in-out infinite;
    }

    .timer.warn {
      border-color: rgba(255, 157, 116, 0.6);
      color: #ffd4c2;
    }

    .timer.danger {
      border-color: rgba(255, 107, 136, 0.75);
      color: #ffdbe5;
      animation: pulse-hot 760ms ease-in-out infinite;
    }

    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    @keyframes pulse-hot {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 0.7rem;
    }

    @media (min-width: 768px) {
      .options-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .ans-btn {
      text-align: left;
      border: none;
      border-radius: 16px;
      min-height: 88px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      padding: 0.8rem;
      font-weight: 700;
      transition: transform 130ms ease, box-shadow 130ms ease, filter 130ms ease;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .ans-btn .letter {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.7);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.18);
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .ans-btn:hover,
    .ans-btn:focus-visible {
      transform: translateY(-1px) scale(1.01);
      filter: brightness(1.06);
    }

    .ans-btn.selected {
      outline: 3px solid rgba(247, 221, 233, 0.88);
      box-shadow: 0 0 0 4px rgba(247, 221, 233, 0.22), 0 14px 28px rgba(0, 0, 0, 0.45);
      animation: select-glow 680ms ease;
    }

    .ans-btn.locked {
      opacity: 0.64;
      transform: none;
      filter: grayscale(0.12);
    }

    .ans-btn.reveal-wrong {
      background: linear-gradient(145deg, #54545d, #3f3f46) !important;
      filter: grayscale(0.25);
      opacity: 0.66;
    }

    .ans-btn.reveal-correct {
      border: 2px solid rgba(255, 246, 194, 0.95);
      box-shadow: 0 0 0 4px rgba(255, 235, 150, 0.2), 0 0 30px rgba(255, 214, 122, 0.55);
      animation: correct-throb 950ms ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    .ans-btn.reveal-correct:hover,
    .ans-btn.reveal-correct:focus-visible {
      transform: scale(1.03) rotate(-0.4deg);
      filter: brightness(1.12) saturate(1.15);
      box-shadow: 0 0 0 6px rgba(255, 232, 144, 0.24), 0 0 40px rgba(255, 214, 122, 0.8);
    }

    @keyframes correct-throb {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.018); }
    }

    .answer-reveal-blast {
      animation: reveal-blast 700ms cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes reveal-blast {
      0% { transform: scale(0.94); opacity: 0; }
      60% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .confetti-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 14px;
      opacity: 0.95;
      animation: confetti-fall 900ms ease-out forwards;
      border-radius: 2px;
    }

    @keyframes confetti-fall {
      from { transform: translateY(-8px) rotate(0deg); opacity: 1; }
      to { transform: translateY(88px) rotate(320deg); opacity: 0; }
    }

    .double-down-banner {
      border-radius: 12px;
      border: 1px solid rgba(255, 194, 145, 0.8);
      background: rgba(130, 73, 37, 0.28);
      color: #ffe8c5;
      font-weight: 800;
      padding: 0.58rem 0.72rem;
      margin-bottom: 0.8rem;
      animation: danger-throb 920ms ease-in-out infinite;
    }

    @keyframes danger-throb {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 194, 145, 0.28); }
      50% { box-shadow: 0 0 0 8px rgba(255, 194, 145, 0); }
    }

    .double-down-note {
      border-radius: 10px;
      border: 1px solid rgba(247, 221, 233, 0.22);
      background: rgba(0, 0, 0, 0.26);
      color: rgba(247, 221, 233, 0.9);
      padding: 0.55rem 0.65rem;
      font-size: 0.9rem;
      line-height: 1.3;
      text-align: center;
    }

    .double-down-note.warn {
      border-color: rgba(255, 194, 145, 0.62);
      color: #ffe2c5;
      background: rgba(123, 63, 32, 0.28);
    }

    .double-down-note.ok {
      border-color: rgba(130, 235, 186, 0.52);
      color: #d9ffed;
      background: rgba(30, 96, 71, 0.26);
    }

    .double-down-note.bad {
      border-color: rgba(255, 132, 158, 0.58);
      color: #ffdce7;
      background: rgba(114, 41, 61, 0.32);
    }

    .streak-prize {
      border-radius: 16px;
      border: 2px solid rgba(255, 231, 142, 0.92);
      background: linear-gradient(145deg, rgba(120, 74, 20, 0.38), rgba(98, 45, 26, 0.45));
      box-shadow: 0 0 0 2px rgba(255, 214, 102, 0.2), 0 0 34px rgba(255, 204, 97, 0.35);
      padding: 0.85rem;
      margin-bottom: 0.9rem;
      animation: prize-pop 680ms ease;
    }

    .streak-prize-title {
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #ffeab7;
      font-size: 1.12rem;
    }

    .streak-prize-note {
      color: #fff0d4;
      font-size: 0.92rem;
    }

    @keyframes prize-pop {
      0% { transform: scale(0.96); opacity: 0.3; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes select-glow {
      0% { box-shadow: 0 0 0 0 rgba(247, 221, 233, 0.45); }
      100% { box-shadow: 0 0 0 9px rgba(247, 221, 233, 0); }
    }

    .c-red { background: linear-gradient(145deg, #cc384f, #a12545); }
    .c-green { background: linear-gradient(145deg, #2aa467, #1f8450); }
    .c-blue { background: linear-gradient(145deg, #3377e2, #2b52b9); }
    .c-purple { background: linear-gradient(145deg, #8451cf, #6943af); }
    .c-orange { background: linear-gradient(145deg, #ea7f2b, #ca5e18); }
    .c-pink { background: linear-gradient(145deg, #d14b8d, #a53672); }

    .lock-state {
      border-radius: 12px;
      border: 1px solid rgba(86, 215, 159, 0.5);
      background: rgba(36, 99, 72, 0.2);
      padding: 0.65rem;
      font-weight: 700;
      animation: pop-msg 280ms ease;
    }

    @keyframes pop-msg {
      from { opacity: 0; transform: translateY(6px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .shake {
      animation: wrong-shake 420ms ease;
    }

    @keyframes wrong-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      50% { transform: translateX(7px); }
      75% { transform: translateX(-4px); }
    }

    .celebrate {
      animation: win-pop 520ms ease;
    }

    @keyframes win-pop {
      0% { transform: scale(0.95); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }

    .rank-row {
      border-radius: 12px;
      border: 1px solid rgba(247, 221, 233, 0.2);
      background: rgba(47, 30, 60, 0.75);
      padding: 0.58rem 0.72rem;
      margin-bottom: 0.45rem;
      animation: rise 280ms ease both;
    }

    .sort-btn {
      border: 1px solid rgba(247, 221, 233, 0.35);
      border-radius: 10px;
      background: rgba(85, 54, 108, 0.55);
      color: var(--pink);
      padding: 0.2rem 0.55rem;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .sort-btn:hover,
    .sort-btn:focus-visible {
      background: rgba(132, 83, 168, 0.6);
      color: #fff;
    }

    .stats-table-wrap {
      border: 1px solid rgba(247, 221, 233, 0.2);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(10, 7, 14, 0.45);
    }

    .stats-table {
      margin-bottom: 0;
      color: var(--pink);
    }

    .stats-table th,
    .stats-table td {
      background: transparent !important;
      border-color: rgba(247, 221, 233, 0.18) !important;
      vertical-align: middle;
      white-space: nowrap;
    }

    .stats-table th {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--lavender);
    }

    .stats-empty {
      border: 1px dashed rgba(247, 221, 233, 0.24);
      border-radius: 12px;
      padding: 0.75rem;
      color: rgba(247, 221, 233, 0.75);
    }

    .podium {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.65rem;
    }

    .podium-card {
      border-radius: 12px;
      text-align: center;
      border: 1px solid rgba(247, 221, 233, 0.3);
      padding: 0.7rem;
      background: rgba(56, 37, 69, 0.7);
    }

    .podium-card.first { box-shadow: 0 0 18px rgba(255, 222, 140, 0.4); }
    .podium-card.second { box-shadow: 0 0 12px rgba(214, 214, 225, 0.25); }
    .podium-card.third { box-shadow: 0 0 12px rgba(214, 168, 148, 0.25); }

    .final-action-summary {
      border-radius: 14px;
      border: 1px solid rgba(255, 231, 142, 0.58);
      background: linear-gradient(150deg, rgba(102, 64, 28, 0.44), rgba(62, 36, 53, 0.5));
      color: #ffeecd;
      padding: 0.7rem 0.8rem;
      margin-bottom: 0.7rem;
      font-weight: 700;
    }

    .power-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
    }

    .power-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
      border-radius: 999px;
      border: 1px solid rgba(247, 221, 233, 0.26);
      background: rgba(0, 0, 0, 0.28);
      color: rgba(247, 221, 233, 0.92);
      padding: 0.18rem 0.5rem;
      font-size: 0.76rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .power-pill.ready {
      border-color: rgba(255, 224, 144, 0.62);
      color: #ffe7ab;
      background: rgba(123, 78, 27, 0.35);
    }

    .power-pill.shield {
      border-color: rgba(145, 240, 211, 0.58);
      color: #d4fff0;
      background: rgba(25, 95, 73, 0.31);
    }

    .power-pill.rocket {
      border-color: rgba(255, 141, 160, 0.62);
      color: #ffd4dd;
      background: rgba(112, 44, 66, 0.34);
    }

    .in-play-strip {
      border-radius: 12px;
      border: 1px solid rgba(247, 221, 233, 0.24);
      background: rgba(0, 0, 0, 0.22);
      padding: 0.55rem 0.65rem;
      margin-bottom: 0.7rem;
    }

    .in-play-icons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
    }

    .power-action-row {
      display: grid;
      gap: 0.65rem;
      grid-template-columns: 1fr;
      align-items: start;
    }

    @media (min-width: 860px) {
      .power-action-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .power-action-col {
      max-width: 420px;
    }

    @keyframes rise {
      from { transform: translateY(6px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .floater {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.22;
      z-index: 0;
      animation: floaty linear infinite;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), rgba(255,255,255,0));
    }

    @keyframes floaty {
      from { transform: translateY(12vh) translateX(0); }
      to { transform: translateY(-120vh) translateX(25px); }
    }

    .focus-ring:focus-visible {
      outline: 2px solid #ffe6ef;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="floatLayer"></div>
  <div class="shell">
    <header class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
      <div>
        <div class="small-note">If this is your first time at Fight Quiz, you have to fight.</div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button id="newFightBtn" class="btn new-fight-pill focus-ring d-none" type="button">New Fight</button>
        <div class="conn-badge"><span id="connDot" class="dot disconnected"></span><span id="connText">Connecting...</span></div>
      </div>
    </header>

    <main id="app"></main>

    <footer class="small-note text-center mt-3 mb-1"><div id="pageFooterQuote">Quote loading...</div><div>This project has no association with the movie Fight Club.</div></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

      const STREAK_ACTION = {

      const QUOTES = [

      function pickRandomQuotes(count) {
        const pool = QUOTES.slice();
        const out = [];
        while (pool.length && out.length < count) {
          const idx = Math.floor(Math.random() * pool.length);
          out.push(pool.splice(idx, 1)[0]);
        }
        return out;
      }

      function quoteSetForPhase(phase) {
        const introspective = QUOTES.filter((q) => /comfort|routine|identity|approval|functioning|disconnected|normal path|obedience|personality/i.test(q));
        const pressure = QUOTES.filter((q) => /pain|chaos|fear|anger|destroy|bottom|control|frightening|extreme/i.test(q));
        const resolution = QUOTES.filter((q) => /freedom|replace it|responsible|question|authentic|understood|alive/i.test(q));
        let pool = QUOTES;
        if (phase === PHASES.LOBBY) pool = introspective.length ? introspective : QUOTES;
        else if (phase === PHASES.QUESTION || phase === PHASES.ANSWER_REVEAL) pool = pressure.length ? pressure : QUOTES;
        else if (phase === PHASES.LEADERBOARD || phase === PHASES.FINISHED) pool = resolution.length ? resolution : QUOTES;
        const local = pool.slice();
        const out = [];
        while (local.length && out.length < 5) {
          const idx = Math.floor(Math.random() * local.length);
          out.push(local.splice(idx, 1)[0]);
        }
        while (out.length < 5) {
          const fill = pickRandomQuotes(1)[0] || "";
          if (!fill) break;
          out.push(fill);
        }
        return {
          title: out[0] || "",
          below: out[1] || "",
          main: out[2] || "",
          extra: out[3] || "",
          footer: out[4] || ""
        };
      }

      function nowTs() { return Date.now(); }
      function generateMessageId() {
        if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
        return "m-" + Math.random().toString(36).slice(2) + "-" + nowTs();
      }
      function formatScore(v) { return Number(v || 0).toLocaleString(); }
      function formatTime(ms) {
        const safe = Math.max(0, ms);
        const sec = Math.floor(safe / 1000);
        const mm = String(Math.floor(sec / 60)).padStart(2, "0");
        const ss = String(sec % 60).padStart(2, "0");
        return mm + ":" + ss;
      }
      function formatMs(ms) {
        if (ms == null || !isFinite(ms)) return "-";
        return Math.round(ms) + " ms";
      }
      function sanitizeName(name) {
        return String(name || "").trim().replace(/\s+/g, " ").slice(0, 30);
      }

        const sp = new URLSearchParams(window.location.search);
        return (sp.get("game") || "").trim().toUpperCase().slice(0, 12);
      }

      class LocalStore {
        static readJson(key, fallback) {
          try {
            const raw = localStorage.getItem(key);
            if (!raw) return fallback;
            return JSON.parse(raw);
          } catch (err) {
            return fallback;
          }
        }
        static writeJson(key, value) {
          localStorage.setItem(key, JSON.stringify(value));
        }
      }

      class SocketManager {
        constructor(onMessage, onState) {
          this.onMessage = onMessage;
          this.onState = onState;
          this.ws = null;
          this.retries = 0;
          this.manual = false;
          this.seen = new Map();
          this.status = "disconnected";
        }

        connect() {
          this.manual = false;
          this._open();
          if (!this.pruneTimer) {
            this.pruneTimer = setInterval(() => this.pruneSeen(), 9000);
          }
        }

        _open() {
          try {
            this.ws = new WebSocket(socketUrl);
          } catch (err) {
            this.scheduleReconnect();
            return;
          }
          this.onState("connecting");
          this.ws.onopen = () => {
            this.retries = 0;
            this.onState("connected");
          };
          this.ws.onclose = () => {
            if (this.manual) {
              this.onState("disconnected");
              return;
            }
            this.scheduleReconnect();
          };
          this.ws.onerror = () => {
            this.onState("reconnecting");
          };
          this.ws.onmessage = (evt) => {
            const msg = this.parse(evt.data);
            if (!msg) return;
            if (!this.validate(msg)) return;
            if (this.isDup(msg.messageId)) return;
            this.onMessage(msg);
          };
        }

        scheduleReconnect() {
          this.onState("reconnecting");
          const delay = Math.min(10000, 900 * Math.pow(1.6, this.retries));
          this.retries += 1;
          setTimeout(() => {
            if (!this.manual) this._open();
          }, delay);
        }

        close() {
          this.manual = true;
          if (this.pruneTimer) clearInterval(this.pruneTimer);
          if (this.ws) this.ws.close();
        }

        send(message) {
          if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return false;
          this.ws.send(JSON.stringify(message));
          return true;
        }

        parse(raw) {
          try { return JSON.parse(raw); } catch (err) { return null; }
        }

        validate(msg) {
          return !!(msg && typeof msg.type === "string" && typeof msg.messageId === "string" && typeof msg.gameId === "string" && typeof msg.senderRole === "string");
        }

        isDup(id) {
          if (!id) return false;
          if (this.seen.has(id)) return true;
          this.seen.set(id, nowTs());
          if (this.seen.size > 1500) this.pruneSeen(true);
          return false;
        }

        pruneSeen(force) {
          const cutoff = nowTs() - 8 * 60 * 1000;
          for (const [k, v] of this.seen.entries()) {
            if (force || v < cutoff) this.seen.delete(k);
          }
        }
      }

        animateCount(id, from, to, duration) {
          const el = document.getElementById(id);
          if (!el) return;
          const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (reduce) {
            el.textContent = formatScore(to);
            return;
          }
          const start = nowTs();
          const diff = to - from;
          const frame = () => {
            const t = Math.min(1, (nowTs() - start) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            const val = Math.round(from + diff * eased);
            el.textContent = formatScore(val);
            if (t < 1) requestAnimationFrame(frame);
          };
          frame();
        }
      }

      function safeText(v) {
        return String(v == null ? "" : v)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")

          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      class StudentGameController {

        hydrateGameState() {
          if (!this.game || typeof this.game !== "object") this.game = {};

          if (typeof this.game.doubleDownNotice !== "string") this.game.doubleDownNotice = "";

          if (typeof this.game.pointShieldNext !== "boolean") this.game.pointShieldNext = false;

        refreshDoubleDownPolicy(serverReason) {
          this.hydrateGameState();

          const cap = Math.max(1, Number(this.game.doubleDownCap || 3));
          const uses = Math.max(0, Number(this.game.doubleDownUses || 0));
          const purchasedCredits = Math.max(0, Number(this.game.doubleDownPurchasedCredits || 0));
          const buyCost = Math.max(1, Number(this.game.doubleDownBuyCost || 3000));
          const rank = this.game.rank == null ? null : Number(this.game.rank);
          const boardSize = Array.isArray(this.game.leaderboard) ? this.game.leaderboard.length : 0;
          const totalPlayers = Math.max(Number(this.game.totalPlayers || 0), boardSize);

          this.game.doubleDownCap = cap;
          this.game.doubleDownUses = uses;
          this.game.doubleDownPurchasedCredits = purchasedCredits;
          this.game.doubleDownBuyCost = buyCost;
          this.game.totalPlayers = totalPlayers;

          let eligible = false;
          let reason = "";
          const baseUsesRemaining = Math.max(0, cap - uses);
          const bonusEligible = rank != null && (rank === 3 || rank === 5 || rank >= Math.max(1, totalPlayers - 4));
          const score = Number(this.game.playerScore || 0);
          const canBuyDoubleDown = rank !== 1 && baseUsesRemaining === 0 && purchasedCredits === 0 && !bonusEligible && score >= buyCost;
          let buyBlockedReason = "";

          if (rank === 1) {
            eligible = false;
            reason = "Double Down is disabled while you are in 1st place.";
          } else if (baseUsesRemaining > 0) {
            eligible = true;
          } else if (purchasedCredits > 0) {
            eligible = true;
          } else if (bonusEligible) {
            eligible = true;
          } else {
            eligible = false;
            reason = "Double Down is disabled after 3 uses unless you are in 3rd, 5th, or bottom 5.";
          }

          if (rank === 1) buyBlockedReason = "1st place cannot buy Double Down.";
          else if (baseUsesRemaining > 0) buyBlockedReason = "Use your remaining standard Double Downs first.";
          else if (purchasedCredits > 0) buyBlockedReason = "You already have a purchased Double Down credit ready.";
          else if (bonusEligible) buyBlockedReason = "Your rank already unlocks bonus Double Down uses.";
          else if (score < buyCost) buyBlockedReason = "Need at least " + formatScore(buyCost) + " points to buy one.";

          if (typeof serverReason === "string" && serverReason.trim() && !eligible) {
            reason = serverReason;
          }

          this.game.doubleDownEligible = eligible;
          this.game.doubleDownDisabledReason = reason;
          this.game.canBuyDoubleDown = canBuyDoubleDown;
          this.game.doubleDownBuyBlockedReason = buyBlockedReason;
        }

        getDoubleDownStatusText(hasNextQuestion) {
          const cap = Math.max(1, Number(this.game.doubleDownCap || 3));
          const uses = Math.max(0, Number(this.game.doubleDownUses || 0));
          const purchasedCredits = Math.max(0, Number(this.game.doubleDownPurchasedCredits || 0));
          const buyCost = Math.max(1, Number(this.game.doubleDownBuyCost || 3000));
          const remaining = Math.max(0, cap - uses);

          if (!hasNextQuestion) {
            return "No next question remains, so Double Down is unavailable.";
          }
          if (this.game.doubleDownArmed) {
            return "Double Down is armed for the next question.";
          }
          if (this.game.rank === 1) {
            return "1st place cannot use Double Down.";
          }
          if (remaining > 0) {
            return remaining + " of " + cap + " standard Double Downs remaining.";
          }
          if (purchasedCredits > 0) {
            return "You have " + purchasedCredits + " purchased Double Down credit" + (purchasedCredits === 1 ? "" : "s") + " available.";
          }
          if (this.game.doubleDownEligible) {
            return "Standard Double Downs are spent. Bonus Double Down is unlocked for your current rank.";
          }
          if (this.game.canBuyDoubleDown) {
            return "Standard Double Downs are spent. You can buy one for " + formatScore(buyCost) + " points.";
          }
          return "Standard Double Downs are spent. Move into 3rd, 5th, or bottom 5 to unlock more.";
        }

        getPointShieldStatusText(hasNextQuestion) {
          const cost = Math.max(1, Number(this.game.pointShieldCost || 2500));
          if (!hasNextQuestion) {
            return "No next question remains, so point shield is unavailable.";
          }
          if (this.game.pointShieldNext) {
            if (String(this.game.pointShieldMode || "NORMAL").toUpperCase() === "REFLECTIVE") {
              return "Reflective shield is armed. Point deductions bounce back to the attacker.";
            }
            return "Point shield is armed for the next question.";
          }
          if (Number(this.game.playerScore || 0) < cost) {
            return "Need at least " + formatScore(cost) + " points to arm point shield.";
          }
          return "Spend " + formatScore(cost) + " points to protect against point deductions on the next question.";
        }

        getReflectiveShieldStatusText(hasNextQuestion) {
          const cost = Math.max(1, Number(this.game.reflectiveShieldCost || 4000));
          if (!hasNextQuestion) return "No next question remains, so reflective shield is unavailable.";
          if (this.game.pointShieldNext && String(this.game.pointShieldMode || "NORMAL").toUpperCase() === "REFLECTIVE") {
            return "Reflective shield armed: attackers take their own deduction on impact.";
          }
          if (this.game.pointShieldNext) return "A shield is already armed for the next question.";
          if (Number(this.game.playerScore || 0) < cost) return "Need at least " + formatScore(cost) + " points to arm reflective shield.";
          return "Spend " + formatScore(cost) + " points to arm reflective shield with blowback.";
        }

        buildStrikeNotice(outcome, delta, count) {
          const strikeCount = Math.max(0, Number(count || 0));
          const amount = Math.abs(Number(delta || 0));
          if (outcome === "STRUCK") {
            return "You were hit by " + strikeCount + " Shadow Strike" + (strikeCount === 1 ? "" : "s") + " and lost " + formatScore(amount || (strikeCount * 1000)) + " points.";
          }
          if (outcome === "SHIELD_BLOCK") {
            return "Your shield blocked " + strikeCount + " Shadow Strike" + (strikeCount === 1 ? "" : "s") + ".";
          }
          if (outcome === "REFLECTED_BLOCK") {
            return "Your reflective shield bounced " + strikeCount + " Shadow Strike" + (strikeCount === 1 ? "" : "s") + " back.";
          }
          if (outcome === "REFLECTED_HIT") {
            return "Your Shadow Strike was reflected and you lost " + formatScore(amount || (strikeCount * 1000)) + " points.";
          }
          return "";
        }

        toggleSortState(scope, key) {
          const target = scope === "leaderboard" ? this.leaderboardSort : this.quickDrawSort;
          const prefersAsc = key === "playerName" || key === "avgResponseMs" || key === "fastestResponseMs";
          const fallbackDir = prefersAsc ? "asc" : "desc";
          if (target.key === key) {
            target.dir = target.dir === "asc" ? "desc" : "asc";
          } else {
            target.key = key;
            target.dir = fallbackDir;
          }
        }

        resetSorts() {
          this.leaderboardSort = { key: "score", dir: "desc" };
          this.quickDrawSort = { key: "avgResponseMs", dir: "asc" };
        }

        sortRows(rows, sortState) {
          const list = rows.slice();
          list.sort((a, b) => {
            if (sortState.key === "playerName") {
              const cmpName = String(a.playerName || "").localeCompare(String(b.playerName || ""));
              if (cmpName !== 0) return sortState.dir === "asc" ? cmpName : -cmpName;
              return Number(a.rank || 0) - Number(b.rank || 0);
            }

            const aVal = a[sortState.key];
            const bVal = b[sortState.key];
            const aNil = aVal == null;
            const bNil = bVal == null;
            if (aNil && bNil) return Number(a.rank || 0) - Number(b.rank || 0);
            if (aNil) return 1;
            if (bNil) return -1;

            const cmpNum = Number(aVal) - Number(bVal);
            if (cmpNum !== 0) return sortState.dir === "asc" ? cmpNum : -cmpNum;
            return Number(a.rank || 0) - Number(b.rank || 0);
          });
          return list;
        }

        buildLeaderboardStats(scoreRankRows) {
          const leaderboardRows = this.sortRows(scoreRankRows, this.leaderboardSort);
          const quickDrawSource = scoreRankRows.filter((row) => Number(row.responseCount || 0) > 0);
          const quickDrawRows = this.sortRows(quickDrawSource, this.quickDrawSort);
          return {
            scoreRankRows,
            leaderboardRows,
            quickDrawRows,
            leaderboardSort: this.leaderboardSort,
            quickDrawSort: this.quickDrawSort
          };
        }

        init() {
          if (!this.identity || !this.identity.playerId) {
            this.identity = {
              playerId: (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : ("p-" + Math.random().toString(36).slice(2)),
              playerName: "",
              gameId: ""
            };
            LocalStore.writeJson(STORAGE_KEYS.IDENTITY, this.identity);
          }

          const qGame = readQueryGame();
          if (qGame) this.game.gameId = qGame;
          this.joinDraft.gameId = this.game.gameId || this.identity.gameId || "";
          this.joinDraft.playerName = this.identity.playerName || "";

          this.socket.connect();
          this.spawnFloaters();
          this.startTicker();
          this.tryAutoRejoin();
          this.render();
        }

        onJoinInputChange(gameIdRaw, nameRaw) {
          this.joinDraft.gameId = String(gameIdRaw || "").toUpperCase().slice(0, 12);
          this.joinDraft.playerName = String(nameRaw || "").slice(0, 30);
        }

        onSocketState(state) {
          this.currentConnState = state;
          this.ui.setConn(state);
          if (state === "connected" && this.game.gameId && this.identity.playerName) {
            this.send(MSG.INSTRUCTOR_PRESENT, this.game.gameId, { probe: true });
            this.sendRejoinAndSync();
          }
        }

        send(type, gameId, payload) {
          const msg = {
            type,
            gameId,
            messageId: generateMessageId(),
            timestamp: nowTs(),
            senderRole: "student",
            senderId: this.identity.playerId,
            payload: payload || {}
          };
          this.socket.send(msg);
        }

        tryAutoRejoin() {
          if (!this.identity || !this.identity.playerName || !this.identity.gameId) return;
          if (this.game.playerRemoved) return;
          this.game.gameId = this.identity.gameId;
          this.sendRejoinAndSync();
        }

        sendRejoinAndSync() {
          if (!this.identity.gameId) return;
          this.send(MSG.PLAYER_REJOIN, this.identity.gameId, {
            playerId: this.identity.playerId,
            playerName: this.identity.playerName
          });
          this.send(MSG.SYNC_REQUEST, this.identity.gameId, {
            playerId: this.identity.playerId
          });
        }

          this.game.attackedCount = 0;

          this.game.strikeDelta = 0;

          this.game.strikeNotice = "";
          this.game.playerDisplayedScore = Number(this.game.playerScore || 0);
          this.game.isScoreMasked = false;
          this.game.fakeScoreTurnsRemaining = 0;
          this.game.fakeScorePrimed = false;
          this.game.correctStreak = 0;
          this.game.longestStreak = 0;
          this.game.streakPrizeAvailable = false;
          this.game.streakPrizeUsed = false;
